version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # a leaked response body leaks a connection
    - errorlint      # errors.Is/As instead of == and type assertions
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    gosec:
      excludes:
        # Command execution is the agent's entire purpose. Safety comes from
        # argv-only execution plus per-action allowlists, not from avoiding
        # exec, and every call site is reviewed for that.
        - G204
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments are enforced by review, not by count

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
