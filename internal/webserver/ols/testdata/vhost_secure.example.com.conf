#
# Generated by OPanel. Do not edit: this file is rewritten
# from the panel database on every change, and edits made here
# or in the WebAdmin console will be lost.
#
# Site: secure.example.com  (php, PHP 8.3)
# Owner: dave
#

docRoot                       /home/dave/secure.example.com/public_html
enableGzip                    1
enableBr                      1

errorlog /home/dave/secure.example.com/logs/error.log {
    useServer                 0
    logLevel                  ERROR
    rollingSize               10M
    keepDays                  30
}

accesslog /home/dave/secure.example.com/logs/access.log {
    useServer                 0
    rollingSize               10M
    keepDays                  30
    compressArchive           1
}

index {
    useServer                 0
    indexFiles                index.php, index.html, index.htm
    autoIndex                 0
}

expires {
    enableExpires             1
}

vhssl {
    keyFile                   /var/lib/opanel/ssl/secure.example.com/privkey.pem
    certFile                  /var/lib/opanel/ssl/secure.example.com/fullchain.pem
    certChain                 1
    sslProtocol               24
    enableECDHE               1
    enableSpdy                15
    enableQuic                1
}

# One external application per site, running as the site's own Linux account.
# This is what keeps one customer's PHP out of another customer's files; a
# single shared interpreter would run every site as the same user.
extprocessor lsphp83_secure_example_com {
    type                      lsapi
    address                   uds://tmp/lshttpd/lsphp83_secure_example_com.sock
    maxConns                  10
    env                       PHP_LSAPI_CHILDREN=10
    env                       LSAPI_AVOID_FORK=200M
    env                       PHP_LSAPI_MAX_REQUESTS=5000
    initTimeout               60
    retryTimeout              0
    persistConn               1
    pcKeepAliveTimeout        60
    respBuffer                0
    autoStart                 2
    path                      /usr/local/lsws/lsphp83/bin/lsphp
    extUser                   dave
    extGroup                  dave
    backlog                   100
    instances                 1
    priority                  0
    memSoftLimit              512M
    memHardLimit              640M
    procSoftLimit             100
    procHardLimit             120
}

scripthandler {
    add                       lsapi:lsphp83_secure_example_com php
}

context / {
    location                  /home/dave/secure.example.com/public_html
    allowBrowse               1
    # .htaccess is how WordPress and most PHP applications express their own
    # rewrite rules, so it is honoured rather than replaced.
    rewrite {
        enable                1
        allowOverride         1
    }
    addDefaultCharset         off
}

# Deny direct access to files that should never be served, whatever the
# application's own rules say.
context /.git {
    location                  /home/dave/secure.example.com/public_html/.git
    allowBrowse               0
}

context /vendor {
    location                  /home/dave/secure.example.com/public_html/vendor
    allowBrowse               0
}
