# from the panel database on every change, and edits made here
# or in the WebAdmin console will be lost.
#
# Catch-all vhost. Serves ACME HTTP-01 challenges for hostnames that no site
# claims, and nothing else: no scripts, no directory listing, no symlinks.
#

docRoot                       /usr/share/opanel/acme
enableGzip                    0

index {
    useServer                 0
    indexFiles                index.html
    autoIndex                 0
}

context / {
    location                  /usr/share/opanel/acme
    allowBrowse               0
}

context /.well-known/acme-challenge {
    location                  /usr/share/opanel/acme/.well-known/acme-challenge
    allowBrowse               1
}
