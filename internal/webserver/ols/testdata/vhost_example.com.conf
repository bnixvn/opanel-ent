#
# Generated by OPanel. Do not edit: this file is rewritten
# from the panel database on every change, and edits made here
# or in the WebAdmin console will be lost.
#
# Site: example.com  (wordpress, PHP 8.4)
# Owner: alice
#

docRoot                       /home/alice/example.com/public_html
enableGzip                    1
enableBr                      1

errorlog /home/alice/example.com/logs/error.log {
    useServer                 0
    logLevel                  ERROR
    rollingSize               10M
    keepDays                  30
}

accesslog /home/alice/example.com/logs/access.log {
    useServer                 0
    rollingSize               10M
    keepDays                  30
    compressArchive           1
}

index {
    useServer                 0
    indexFiles                index.php, index.html, index.htm
    autoIndex                 0
}

expires {
    enableExpires             1
}

# One external application per site, running as the site's own Linux account.
# This is what keeps one customer's PHP out of another customer's files; a
# single shared interpreter would run every site as the same user.
extprocessor lsphp84_example_com {
    type                      lsapi
    address                   uds://tmp/lshttpd/lsphp84_example_com.sock
    maxConns                  10
    env                       PHP_LSAPI_CHILDREN=10
    env                       LSAPI_AVOID_FORK=200M
    env                       PHP_LSAPI_MAX_REQUESTS=5000
    initTimeout               60
    retryTimeout              0
    persistConn               1
    pcKeepAliveTimeout        60
    respBuffer                0
    autoStart                 2
    path                      /usr/local/lsws/lsphp84/bin/lsphp
    extUser                   alice
    extGroup                  alice
    backlog                   100
    instances                 1
    priority                  0
    memSoftLimit              512M
    memHardLimit              640M
    procSoftLimit             100
    procHardLimit             120
}

scripthandler {
    add                       lsapi:lsphp84_example_com php
}

context / {
    location                  /home/alice/example.com/public_html
    allowBrowse               1
    # .htaccess is how WordPress and most PHP applications express their own
    # rewrite rules, so it is honoured rather than replaced.
    rewrite {
        enable                1
        allowOverride         1
    }
    addDefaultCharset         off
}

# Certificate renewals must keep working while the site is live, and while it
# is suspended: a suspension is not a reason to let the certificate lapse.
context /.well-known/acme-challenge {
    location                  /usr/share/opanel/acme/.well-known/acme-challenge
    allowBrowse               1
}

# Deny direct access to files that should never be served, whatever the
# application's own rules say.
context /.git {
    location                  /home/alice/example.com/public_html/.git
    allowBrowse               0
}

context /vendor {
    location                  /home/alice/example.com/public_html/vendor
    allowBrowse               0
}

# xmlrpc.php is a standing brute-force and pingback-amplification target and
# is not needed by a normal WordPress site.
context /xmlrpc.php {
    location                  /home/alice/example.com/public_html/xmlrpc.php
    allowBrowse               0
}
