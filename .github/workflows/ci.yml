name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The race detector needs cgo, so it runs as a separate step rather
      # than changing the build settings used for release artefacts.
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the build can name itself. Without them git describe
          # sees no tag and every artifact reports "dev".
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build static binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          # The same stamping the Makefile does. It was missing here, so
          # every binary this workflow published called itself "dev" -- and
          # the System page, which reads it, agreed.
          PKG=github.com/bnixvn/opanel-ent/internal/version
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo '')
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for b in opanel-api opanel-agent opanelctl; do
            LDFLAGS="-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.Date=$DATE"
            go build -trimpath -ldflags "$LDFLAGS" -o "dist/$b" "./cmd/$b"
          done
          ls -lh dist
          ./dist/opanelctl version || true

      - uses: actions/upload-artifact@v4
        with:
          name: opanel-linux-${{ matrix.goarch }}
          path: dist/
