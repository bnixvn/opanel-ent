name: Security

# Dependency CVE scanning. The scheduled run is the point of this workflow:
# a pinned dependency does not change, but the advisories against it keep
# arriving, so a push-only scan goes stale the moment the last commit lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-deps:
    name: Go dependencies (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # Reachability-based: it reports a vulnerable function this code can
      # actually call, rather than every advisory against everything in
      # go.sum. That is the difference between a list somebody reads and a
      # list somebody learns to ignore.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  node-deps:
    name: Panel frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit
        run: npm audit --audit-level=high
