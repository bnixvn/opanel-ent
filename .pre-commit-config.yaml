# Go is checked by golangci-lint in CI rather than here: it needs the whole
# module to say anything useful, which is slower than a commit hook should
# be. What is left are the checks that are cheap and catch things review
# does not — a private key pasted into a file, a 40 MB binary, a YAML that
# does not parse.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
